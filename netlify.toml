[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "/api"
  VITE_GOOGLE_CLIENT_ID = "366765809458-c23jof11u0ki547sde162mjmufrpoch2.apps.googleusercontent.com"
  VITE_CLOUDINARY_CLOUD_NAME = "digchl1nh"
  VITE_CLOUDINARY_UPLOAD_PRESET = "kkr_unsigned"

[[redirects]]
  from = "/api/*"
  to = "https://newbuyandsell-production.up.railway.app/:splat"
  status = 200
  force = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
